stats=SELECT DP.POLICY_LINES, POL.POLICY_NUMBER, POL.POLICY_IMAGE_ID, POL.POLICY_TRANSACTION_ID, POL.DATE_CREATED, POL.TRX_DATE_PROCESSED, POL.TRX_DATE_EFFECTIVE, ROLL.ACCOUNTING_TOTAL_ROLLUP, CALC.TOTAL_COVERAGE_SUM, ROLL.ACCOUNTING_TOTAL_ROLLUP - CALC.TOTAL_COVERAGE_SUM DIFFERENCE FROM (SELECT DISTINCT PT.POLICY_NUMBER, DTS.POLICY_IMAGE_ID, DTS.POLICY_TRANSACTION_ID, PT.DATE_CREATED, PT.TRX_DATE_PROCESSED, PT.TRX_DATE_EFFECTIVE FROM priv_st.DRAGON_TRANSACTION_STATS DTS JOIN priv_st.ODS_POLICY_TRANSACTION PT ON (DTS.POLICY_TRANSACTION_ID = PT.POLICY_TRANSACTION_ID) WHERE DTS.COVERAGE_NAME = 'Accounting Rollup - Premium') POL LEFT OUTER JOIN (SELECT PT1.POLICY_NUMBER, PT1.POLICY_TRANSACTION_ID, SUM(DTS1.CHANGE_AMOUNT) ACCOUNTING_TOTAL_ROLLUP FROM priv_st.DRAGON_TRANSACTION_STATS DTS1 JOIN priv_st.ODS_POLICY_TRANSACTION PT1 ON (DTS1.POLICY_TRANSACTION_ID = PT1.POLICY_TRANSACTION_ID) WHERE DTS1.COVERAGE_NAME = 'Accounting Rollup - Premium' GROUP BY PT1.POLICY_NUMBER, PT1.POLICY_TRANSACTION_ID) ROLL ON (POL.POLICY_NUMBER = ROLL.POLICY_NUMBER AND POL.POLICY_TRANSACTION_ID = ROLL.POLICY_TRANSACTION_ID) LEFT OUTER JOIN (SELECT PT2.POLICY_NUMBER, PT2.POLICY_TRANSACTION_ID, SUM(DTS2.CHANGE_AMOUNT) TOTAL_COVERAGE_SUM FROM priv_st.DRAGON_TRANSACTION_STATS DTS2 JOIN priv_st.ODS_POLICY_TRANSACTION PT2 ON (DTS2.POLICY_TRANSACTION_ID = PT2.POLICY_TRANSACTION_ID) WHERE ( (SUBSTR(PT2.POLICY_NUMBER, 1, 2) = 'HS' AND DTS2.COVERAGE_NAME NOT IN ( 'Total Location Premium including Collections', 'Collections Total Premium', 'Accounting Rollup - Premium', 'Accounting Rollup - Surplus Contribution', 'Accounting Rollup - Surcharge', 'Accounting Rollup - Fees', 'Accounting Rollup - Taxes', 'Accounting Rollup - Commissions', 'Grand Total Premium', 'Total Premium', 'Manuscript Endorsements Total', 'Premium Adjustment Total', 'Non Wind/Wind Final Premium', 'Location Premium', 'Optional Coverages Premium', 'Total Location Premium', 'Florida Hurricane CAT Fund Assessment - Home', 'Florida CEA Fund Assessment', 'Capital Contribution', '2005 LA Fair Plan Emergency Assessment - Home', 'Excess Flood', 'Reset Coverage', 'Bureau Rate - Policy', 'Bureau Rate - Location', 'Multiplicative Premium - Policy', 'Multiplicative Premium - Location', 'Collections Total Premium Before adjustments', 'E&S Florida Premium Tax - Inspection Fee', 'E&S Florida Premium Tax - Inspection Fee per Location', 'EMPA Surcharge', 'E&S Florida Premium Tax - Policy Premium', 'E&S Florida Premium Tax - Surplus Lines Broker Fee', 'Surplus Lines Broker Fee', 'Reporting - Non Wind Premium Final', 'Reporting - Wind Premium Final', 'Florida Stamping Fee - Broker Fee' , 'Inspection Fee', 'Inspection Fee per Location', 'Total Location Premium including Collections', 'Total Location Premium without Collections', 'Stamping Fee - Inspection Fee', 'Stamping Fee - Inspection Fee per Location', 'Stamping Fee - Policy Premium', 'Reporting - Location Inspection Fee', 'Reporting - Location Premium Before', 'Reporting - Location Premium Final ROL', 'Reporting - Non-Wind Premium Final ROL', 'Reporting - Total Location Premium Before', 'Reporting - Total Location Premium Final ROL', 'Reporting - Wind Premium Final ROL', 'Surplus Lines Broker Fee', 'Liability Extension Value', 'Worldwide Jewelry', 'Worldwide Jewelry - Blanket', 'Worldwide Jewelry - Scheduled', 'Collectibles', 'Collectibles - Blanket', 'Collectibles - Scheduled', 'Fine Art', 'Fine Art - Blanket', 'Fine Art - Scheduled', 'Wine', 'Wine - Blanket', 'Wine - Scheduled', 'Coins, Silver, Stamps, Furs, Musical Instruments', 'Coins, Silver, Stamps, Furs, Musical Instruments - Blanket', 'Coins, Silver, Stamps, Furs,Musical Instruments - Scheduled', 'PSE Surplus Contribution', 'E&S Florida Premium Tax - PSE Surplus Contribution', 'Bank Vaulted Jewelry' ) ) ) GROUP BY PT2.POLICY_NUMBER, PT2.POLICY_TRANSACTION_ID) CALC ON (POL.POLICY_NUMBER = CALC.POLICY_NUMBER AND POL.POLICY_TRANSACTION_ID = CALC.POLICY_TRANSACTION_ID) LEFT OUTER JOIN priv_st.DRAGON_POLICY DP ON (SUBSTR(POL.POLICY_NUMBER, 1, 9) = SUBSTR(DP.POLICY_NUMBER, 1, 9)) WHERE POL.POLICY_TRANSACTION_ID in ({transactionID}) ORDER BY trx_date_processed desc
riskmeter=select * from PRIV_ST.priv_service_perf_log where upper(OPERATION_LABEL) = 'RISKMETER' and LAST_UPDT_DATE >= sysdate - 1 and SESSION_ID = {ID} order by PRIV_SERVICE_PERF_LOG_id desc
onBase=SELECT * FROM priv_st.document_onbase_map WHERE document_object_id IN ({ID})
cape=SELECT DPQ.POLICYQUOTE_PRODUCT_NAME AS PRODUCT,DPQ.POLICYQUOTE_NAME AS QUOTE_OR_POLICY, EQJS.POLICY_IMAGE_ID, EQJS.JOB_ID,EQJS.CREATED_DATE, EQJS.LAST_UPDATED_DATE, EQJS.REPORT_NAME, EQJS.QUEUE_NAME, EQJS.JOB_STATUS, EQJS.MATCH_KEY, EQJS.MESSAGE_REQUEST_TEXT, EQJS.MESSAGE_RESPONSE_TEXT FROM PRIV_ST.EXTERNAL_QUEUE_JOB_STATUS EQJS LEFT JOIN PRIV_ST.DRAGON_POLICY_QUOTE DPQ ON DPQ.POLICYQUOTE_ID = EQJS.POLICY_IMAGE_ID WHERE EQJS.USER_SESSION_ID = {ID} AND EQJS.QUEUE_NAME = 'CAPE_AERIAL_IMAGERY_QUEUE' ORDER BY EQJS.CREATED_DATE DESC
coherent=SELECT * FROM priv_st.SL_SERVICE_OP_LOG WHERE operation_label = 'externalRateTrx' AND CONTEXT_OBJECT_ID = {ID} ORDER BY TIME_STAMP DESC
docusign=select RELATION_OBJECT_ID from priv_st.object_relation where object_id = {ID} and OBJECT_RELATIONSHIP_BV_ID = 31710637